
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi QR - Insan Tazakka</title>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 24px auto;
      padding: 16px;
      background: #f3f7f4;
      color: #26352d;
    }
    .kartu {
      background: white;
      padding: 22px;
      border: 1px solid #dce5de;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 4px 18px #00000008;
    }
    input, select {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccd8cf;
      border-radius: 8px;
      font-size: 16px;
      background: white;
      color: #26352d;
    }
    button {
      padding: 12px 16px;
      margin: 6px 3px;
      border: 0;
      border-radius: 8px;
      background: #285b45;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    #reader {
      width: 100%;
      margin: 18px auto;
    }
    #pesan {
      padding: 12px;
      background: #f0f4f0;
      border-radius: 8px;
      overflow-wrap: anywhere;
      text-align: left;
      font-size: 14px;
    }
    .sembunyi { display: none; }
    .identitas {
      background: #edf5ef;
      border-radius: 10px;
      padding: 12px;
      margin: 14px 0;
    }
    .sekunder { background: #65736a; }
  </style>
</head>

<body>
<main class="kartu">
  <h2>INSAN TAZAKKA</h2>
  <p>Sistem Absensi QR Siswa</p>

  <section id="formLogin">
    <h3>Login Guru</h3>

    <select id="pilihGuru" autocomplete="username">
      <option value="">Memuat daftar guru...</option>
    </select>

    <input id="pinGuru" type="password"
      placeholder="PIN pribadi guru"
      inputmode="numeric"
      autocomplete="current-password">

    <button id="btnLogin" onclick="loginGuru()">
      Login
    </button>
  </section>

  <section id="areaScan" class="sembunyi">
    <div class="identitas">
      <strong id="namaGuru"></strong>
      <div id="idGuruAktif"></div>
    </div>

    <div id="reader"></div>

    <button id="mulai" onclick="mulaiKamera()">
      Aktifkan Kamera
    </button>
    <button id="henti" class="sekunder"
      onclick="hentikanKamera()">
      Hentikan Kamera
    </button>
    <button class="sekunder" onclick="logoutGuru()">
      Keluar
    </button>
  </section>

  <p id="pesan" role="status">
    Silakan pilih nama guru dan masukkan PIN.
  </p>
</main>

<script>
  const URL_WORKER =
    "https://absensi-insan-tazakka.kurikulum-it.workers.dev/";

  let sessionToken = "";
  let scanner = null;
  let aktif = false;
  let memulai = false;
  let sedangMemproses = false;
  let terakhirQR = "";
  let waktuQR = 0;

  const $ = id => document.getElementById(id);
  const pesan = $("pesan");

  function tampilPesan(teks) {
    pesan.textContent = teks;
  }

  async function ambilDaftarGuru() {
    const pilihan = $("pilihGuru");
    pilihan.disabled = true;
    pilihan.innerHTML =
      '<option value="">Memuat daftar guru...</option>';

    try {
      const response = await fetch(
        URL_WORKER + "?action=daftar_guru"
      );

      const hasil = await response.json();

      if (hasil.status !== "OK" || !Array.isArray(hasil.data)) {
        throw new Error("Daftar guru tidak tersedia.");
      }

      pilihan.innerHTML =
        '<option value="">-- Pilih Nama Guru --</option>';

      hasil.data.forEach(guru => {
        if (!guru.idGuru || !guru.nama) return;

        const opsi = document.createElement("option");
        opsi.value = guru.idGuru;
        opsi.textContent = guru.nama;
        pilihan.appendChild(opsi);
      });

      if (pilihan.options.length <= 1) {
        pilihan.innerHTML =
          '<option value="">Belum ada guru aktif</option>';
        tampilPesan("Daftar guru kosong. Periksa data guru.");
      } else {
        tampilPesan("Silakan pilih nama guru dan masukkan PIN.");
      }
    } catch (error) {
      pilihan.innerHTML =
        '<option value="">Gagal memuat daftar guru</option>';
      tampilPesan(
        "Daftar guru gagal dimuat. Periksa endpoint daftar_guru pada server."
      );
    } finally {
      pilihan.disabled = false;
    }
  }

  async function kirim(data) {
    const response = await fetch(URL_WORKER, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const hasil = await response.json();

    if (!response.ok && hasil.status === undefined) {
      throw new Error("Server tidak dapat memproses permintaan.");
    }

    return hasil;
  }

  async function loginGuru() {
    if ($("btnLogin").disabled) return;

    const idGuru = $("pilihGuru").value;
    const pin = $("pinGuru").value;

    if (!idGuru || !pin) {
      tampilPesan("Pilih nama guru dan masukkan PIN terlebih dahulu.");
      return;
    }

    $("btnLogin").disabled = true;
    tampilPesan("Memeriksa akun guru...");

    try {
      const hasil = await kirim({
        action: "login_guru",
        idGuru: idGuru,
        pin: pin
      });

      if (hasil.status !== "OK" || !hasil.sessionToken) {
        tampilPesan(hasil.pesan || "Login gagal.");
        return;
      }

      sessionToken = hasil.sessionToken;
      $("namaGuru").textContent =
        hasil.nama || $("pilihGuru").selectedOptions[0].textContent;
      $("idGuruAktif").textContent = "ID: " + (hasil.idGuru || idGuru);
      $("pinGuru").value = "";

      $("formLogin").classList.add("sembunyi");
      $("areaScan").classList.remove("sembunyi");

      tampilPesan(
        "Login berhasil. Tekan Aktifkan Kamera untuk mulai scan."
      );
    } catch (error) {
      tampilPesan("Gagal menghubungi server. Periksa koneksi internet.");
    } finally {
      $("btnLogin").disabled = false;
    }
  }

  async function mulaiKamera() {
    if (aktif || memulai || sedangMemproses) return;

    if (!sessionToken) {
      tampilPesan("Sesi login tidak tersedia. Silakan login kembali.");
      return;
    }

    if (!window.isSecureContext ||
        !navigator.mediaDevices?.getUserMedia) {
      tampilPesan("Kamera memerlukan akses HTTPS.");
      return;
    }

    if (typeof Html5Qrcode === "undefined") {
      tampilPesan("Pemindai QR belum termuat. Periksa koneksi.");
      return;
    }

    memulai = true;
    $("mulai").disabled = true;
    tampilPesan("Menyiapkan kamera...");

    try {
      scanner = new Html5Qrcode("reader");

      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 230, height: 230 } },
        async hasil => {
          if (sedangMemproses || !sessionToken) return;

          const sekarang = Date.now();
          if (hasil === terakhirQR &&
              sekarang - waktuQR < 2500) return;

          terakhirQR = hasil;
          waktuQR = sekarang;
          sedangMemproses = true;

          try {
            await prosesAbsensi(hasil);
          } finally {
            sedangMemproses = false;
          }
        },
        () => {}
      );

      aktif = true;
      tampilPesan("Kamera aktif. Arahkan ke QR siswa.");
    } catch (error) {
      aktif = false;
      tampilPesan("Kamera gagal diaktifkan. Periksa izin kamera.");
    } finally {
      memulai = false;
      $("mulai").disabled = false;
    }
  }

  async function prosesAbsensi(tokenQR) {
    tampilPesan("QR terbaca. Memproses absensi...");

    try {
      const hasil = await kirim({
        action: "absensi_pagi",
        token: tokenQR,
        sessionToken
      });

      if (hasil.status === "OK") {
        tampilPesan("BERHASIL: " +
          (hasil.pesan || "Absensi tercatat."));
      } else if (hasil.status === "DUPLIKAT") {
        tampilPesan("INFO: Siswa sudah tercatat hadir.");
      } else if (hasil.status === "DITOLAK") {
        tampilPesan("DITOLAK: " +
          (hasil.pesan || "Permintaan ditolak."));

        if ((hasil.pesan || "").toLowerCase().includes("sesi")) {
          await logoutGuru();
        }
      } else {
        tampilPesan("GAGAL: " +
          (hasil.pesan || "Absensi tidak berhasil."));
      }
    } catch (error) {
      tampilPesan("Gagal menghubungi server. Periksa koneksi internet.");
    }
  }

  async function hentikanKamera() {
    if (memulai) {
      tampilPesan("Kamera sedang disiapkan. Tunggu sebentar.");
      return;
    }

    if (!scanner || !aktif) {
      tampilPesan("Kamera sedang tidak aktif.");
      return;
    }

    $("henti").disabled = true;

    try {
      await scanner.stop();
      aktif = false;
      tampilPesan(
        "Kamera dihentikan. Tekan Aktifkan Kamera untuk melanjutkan."
      );
    } catch (error) {
      tampilPesan("Kamera belum dapat dihentikan. Coba kembali.");
    } finally {
      $("henti").disabled = false;
    }
  }

  async function logoutGuru() {
    if (aktif && scanner) {
      try {
        await scanner.stop();
      } catch (error) {}
    }

    if (scanner) {
      try {
        await scanner.clear();
      } catch (error) {}
    }

    scanner = null;
    aktif = false;
    memulai = false;
    sedangMemproses = false;
    sessionToken = "";
    terakhirQR = "";
    waktuQR = 0;

    $("pinGuru").value = "";
    $("pilihGuru").value = "";
    $("areaScan").classList.add("sembunyi");
    $("formLogin").classList.remove("sembunyi");
    tampilPesan("Anda telah keluar. Silakan login kembali.");
  }

  ambilDaftarGuru();
</script>
</body>
</html>
