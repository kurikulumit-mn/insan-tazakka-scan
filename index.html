
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi QR - Insan Tazakka</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 24px auto;
      padding: 16px;
      background: #f5f8f5;
      color: #26352d;
    }

    .kartu {
      background: white;
      padding: 22px;
      border: 1px solid #dce5de;
      border-radius: 16px;
      text-align: center;
    }

    #reader {
      width: 100%;
      margin: 20px auto;
    }

    #pesan {
      padding: 12px;
      background: #f0f4f0;
      border-radius: 8px;
      overflow-wrap: anywhere;
      text-align: left;
      font-size: 14px;
    }

    button {
      padding: 12px 18px;
      margin: 6px 3px;
      border: 0;
      border-radius: 8px;
      background: #285b45;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>
  <main class="kartu">
    <h2>INSAN TAZAKKA</h2>
    <p>Absensi QR Siswa</p>

    <div id="reader"></div>

    <button id="mulai" onclick="mulaiKamera()">
      Aktifkan Kamera
    </button>

    <button id="henti" onclick="hentikanKamera()">
      Hentikan Kamera
    </button>

    <p id="pesan" role="status">
      Kamera belum diaktifkan.
    </p>
  </main>

  <script>
    const URL_WORKER_ABSENSI =
      "https://absensi-insan-tazakka.kurikulum-it.workers.dev/";

    let scanner = null;
    let aktif = false;
    let memulai = false;
    let sedangMemproses = false;

    const pesan = document.getElementById("pesan");
    const tombolMulai = document.getElementById("mulai");
    const tombolHenti = document.getElementById("henti");

    async function mulaiKamera() {
      if (aktif || memulai || sedangMemproses) return;

      if (!window.isSecureContext ||
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia) {
        pesan.textContent =
          "Akses kamera tidak tersedia. Buka halaman HTTPS.";
        return;
      }

      if (typeof Html5Qrcode === "undefined") {
        pesan.textContent =
          "Pemindai belum termuat. Periksa koneksi internet.";
        return;
      }

      memulai = true;
      tombolMulai.disabled = true;
      pesan.textContent = "Menyiapkan kamera...";

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 230, height: 230 } },
          async function (hasil) {
            if (sedangMemproses) return;

            sedangMemproses = true;
            tombolMulai.disabled = true;
            pesan.textContent = "QR terbaca. Menyiapkan absensi...";

            try {
              if (scanner && aktif) {
                await scanner.stop();
                aktif = false;
              }

              await validasiTokenQR(hasil);
            } catch (error) {
              pesan.textContent =
                "Terjadi kendala: " +
                (error.message || String(error));
            } finally {
              sedangMemproses = false;
              tombolMulai.disabled = false;
            }
          },
          function () {}
        );

        aktif = true;
        pesan.textContent =
          "Kamera aktif. Arahkan kamera ke QR siswa.";
      } catch (error) {
        pesan.textContent =
          "Gagal mengaktifkan kamera: " +
          (error.message || String(error));
      } finally {
        memulai = false;
        tombolMulai.disabled = false;
      }
    }

    async function hentikanKamera() {
      if (memulai) {
        pesan.textContent =
          "Kamera sedang disiapkan. Tunggu sebentar.";
        return;
      }

      if (!scanner || !aktif) {
        pesan.textContent = "Kamera sedang tidak aktif.";
        return;
      }

      tombolHenti.disabled = true;

      try {
        await scanner.stop();
        aktif = false;
        pesan.textContent = "Kamera telah dihentikan.";
      } catch (error) {
        pesan.textContent =
          "Gagal menghentikan kamera: " +
          (error.message || String(error));
      } finally {
        tombolHenti.disabled = false;
      }
    }

    async function validasiTokenQR(token) {
      const pin = window.prompt(
        "Masukkan PIN petugas gerbang:"
      );

      if (pin === null || pin.trim() === "") {
        pesan.textContent = "Absensi dibatalkan.";
        return;
      }

      pesan.textContent = "Mengirim data absensi...";

      try {
        const response = await fetch(URL_WORKER_ABSENSI, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token: token,
            pin: pin
          })
        });

        const data = await response.json();

        if (data.status === "OK") {
          pesan.textContent =
            "BERHASIL: Kehadiran siswa tercatat.";
        } else if (data.status === "DUPLIKAT") {
          pesan.textContent =
            "INFO: Siswa sudah tercatat hadir.";
        } else if (data.status === "DITOLAK") {
          pesan.textContent =
            "DITOLAK: " + (data.pesan || "Permintaan ditolak.");
        } else {
          pesan.textContent =
            "GAGAL: " +
            (data.pesan || "Absensi belum berhasil dicatat.");
        }
      } catch (error) {
        pesan.textContent =
          "Gagal menghubungi server. Periksa koneksi internet.";
      }
    }
  </script>
</body>
</html>
